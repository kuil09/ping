name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint main.ts
      - run: deno check main.ts
      - run: deno eval 'import webpush from "web-push"; const keys = webpush.generateVAPIDKeys(); if (!keys.publicKey || !keys.privateKey) Deno.exit(1);'
