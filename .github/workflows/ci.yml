name: Cloudflare CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install the exact reviewed dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime
      - name: Install isolated browser engines and Korean fonts
        run: |
          npx playwright install --with-deps chromium webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Native workerd WebSocket, alarm and browser regressions
        run: npm run test:browser
      - name: Collect built worker and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-verification
          path: |
            package-lock.json
            dist/
            test-results/
          retention-days: 7
