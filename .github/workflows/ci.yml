name: Cloudflare CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Temporary public dependency snapshot for local verification
        run: tar -czf /tmp/ping-dependencies.tar.gz node_modules package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: migration-dependencies
          path: /tmp/ping-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Install isolated browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Native workerd WebSocket, alarm and browser regressions
        run: npm run test:browser
      - name: Collect exact lockfile, built worker and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-verification
          path: |
            package-lock.json
            dist/
            test-results/
          retention-days: 7
