name: Cloudflare CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: write
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Stage the generated public dependency lock blob for review (temporary)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "const fs=require('fs');fs.writeFileSync('/tmp/lock-blob.json',JSON.stringify({content:fs.readFileSync('package-lock.json','utf8'),encoding:'utf-8'}))"
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/blobs" --input /tmp/lock-blob.json --jq .sha
          git hash-object package-lock.json
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run test:runtime
      - name: Install isolated browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Native workerd WebSocket, alarm and browser regressions
        run: npm run test:browser
      - name: Collect exact lockfile, built worker and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-verification
          path: |
            package-lock.json
            dist/
            test-results/
          retention-days: 7
