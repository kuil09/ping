name: Migration source snapshot
on:
  push:
    branches: [feat/cloudflare-hibernation]
    paths: [.github/workflows/migration-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked public repository source only
        run: git archive --format=tar HEAD -o source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: migration-source
          path: source.tar
          retention-days: 1
