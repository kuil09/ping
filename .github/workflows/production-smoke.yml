name: Production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "main.ts"
      - "state.ts"
      - "public/**"
      - "tests/mobile.spec.cjs"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PING_TEST_ORIGIN: https://ping.kuil09.deno.net
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated browser tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Wait for healthy KV and the exact committed browser assets
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash = value => createHash('sha256').update(value).digest('hex');
          const expected = Object.fromEntries(['app.js', 'tab-status.js', 'sw.js'].map(file => [file, hash(fs.readFileSync('public/' + file))]));
          let result;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch(process.env.PING_TEST_ORIGIN + '/api/health', { signal: AbortSignal.timeout(10000), cache: 'no-store' });
              const health = await response.json();
              if (!response.ok || !health.ok || health.version !== 'shared-kv-v2' || health.storage !== 'deno-kv' || !health.generation || health.generation === 'local') throw new Error('KV/generation not ready');
              const assets = {};
              for (const [file, digest] of Object.entries(expected)) {
                const asset = await fetch(process.env.PING_TEST_ORIGIN + '/' + file + '?smoke=' + process.env.GITHUB_SHA, { signal: AbortSignal.timeout(10000), cache: 'no-store' });
                if (!asset.ok) throw new Error('Asset not ready: ' + file);
                assets[file] = hash(Buffer.from(await asset.arrayBuffer()));
                if (assets[file] !== digest) throw new Error('Waiting for committed asset: ' + file);
              }
              result = { health, assets, commit: process.env.GITHUB_SHA, verifiedAt: new Date().toISOString() };
              break;
            } catch (error) { console.log(error.message); }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!result) throw new Error('The committed production assets and KV generation did not become ready');
          fs.writeFileSync('evidence/deployment.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result));
          JS
      - name: Verify deployed mobile flows and hidden-tab countdown over SSE
        run: npx playwright test --config=playwright.config.cjs
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: |
            evidence/
            test-results/
          retention-days: 7
