name: Production smoke

on:
  workflow_dispatch:
    inputs:
      full_browser:
        description: Explicitly run the full browser suite against fresh production channels (consumes Deno quota)
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "main.ts"
      - "live.ts"
      - "state.ts"
      - "public/**"
      - "deno.json"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PING_TEST_ORIGIN: https://ping.kuil09.deno.net
    steps:
      - uses: actions/checkout@v4
      - name: Bounded HTTP-only deployment verification (no SSE or browser sessions)
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { createHash } from 'node:crypto';
          const hash = value => createHash('sha256').update(value).digest('hex');
          let health;
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(process.env.PING_TEST_ORIGIN + '/api/health', { signal: AbortSignal.timeout(10000), cache: 'no-store' });
            const body = await response.text();
            if ([402, 403, 429].includes(response.status) || /quota exceeded|usage limit|memory.*limit/i.test(body)) {
              throw new Error('Deployment verification stopped: platform quota/access limit (' + response.status + '). No automatic full regression or retry storm.');
            }
            try {
              const value = JSON.parse(body);
              if (response.ok && value.ok && value.resourceVersion === 'pooled-live-v1' && value.generation !== 'local') { health = value; break; }
            } catch { /* deployment warming; bounded below */ }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          if (!health) throw new Error('New resource version is not deployed; stopped after six checks');
          const assets = {};
          for (const file of ['index.html', 'app.js', 'ping-sound.js']) {
            const response = await fetch(process.env.PING_TEST_ORIGIN + '/' + file, { signal: AbortSignal.timeout(10000), cache: 'no-store' });
            if (!response.ok) throw new Error('Asset unavailable: ' + file);
            const actual = hash(Buffer.from(await response.arrayBuffer()));
            if (actual !== hash(fs.readFileSync('public/' + file))) throw new Error('Asset mismatch: ' + file);
            assets[file] = actual;
          }
          fs.writeFileSync('evidence/deployment.json', JSON.stringify({ commit: process.env.GITHUB_SHA, health, assets, verifiedAt: new Date().toISOString(), verification: 'HTTP-only; no live browser/SSE regression' }, null, 2));
          console.log('HTTP-only deployment check passed; full browser regression stays in CI.');
          JS
      - name: Install browser tools only on explicit manual request
        if: github.event_name == 'workflow_dispatch' && inputs.full_browser
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Explicit full production regression
        if: github.event_name == 'workflow_dispatch' && inputs.full_browser
        run: npx playwright test --config=playwright.config.cjs
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: |
            evidence/
            test-results/
          retention-days: 7
