name: Production smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/production-smoke.yml"
      - "main.ts"
      - "state.ts"
      - "public/**"
      - "tests/mobile.spec.cjs"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PING_TEST_ORIGIN: https://ping.kuil09.deno.net
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated browser tools
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Wait for deployed shared-kv-v2 and verify its generation
        run: |
          mkdir -p evidence
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          let health;
          for (let attempt = 0; attempt < 30; attempt++) {
            try {
              const response = await fetch(process.env.PING_TEST_ORIGIN + '/api/health', { signal: AbortSignal.timeout(10000), cache: 'no-store' });
              const value = await response.json();
              if (response.ok && value.ok && value.version === 'shared-kv-v2' && value.storage === 'deno-kv' && value.generation && value.generation !== 'local') { health = value; break; }
            } catch { /* wait for deployment */ }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!health) throw new Error('New deployment/generation did not become healthy');
          fs.writeFileSync('evidence/health.json', JSON.stringify(health, null, 2));
          console.log(JSON.stringify(health));
          JS
      - name: Verify deployed clock, toggle, lease expiry and mobile signaling
        run: npx playwright test --config=playwright.config.cjs
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: |
            evidence/
            test-results/
          retention-days: 7
