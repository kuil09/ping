<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ping">
  <title>ping</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <button id="share" class="icon" aria-label="채널 공유" title="채널 공유">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m0-12 4 4m-4-4L8 7M5 11v8h14v-8"/></svg>
      </button>
      <button id="notify" class="icon" aria-label="알림 허용" title="알림 허용" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16h12l-1.5-2V9a4.5 4.5 0 0 0-9 0v5L6 16Zm4 3h4"/></svg>
      </button>
    </header>
    <section class="stage" aria-label="핑 채널">
      <div class="ping-clock" id="ping-clock" data-active="false">
        <span class="eyebrow">최근 핑</span>
        <time id="ping-time">--:--:--</time>
        <span id="ping-age">아직 없음</span>
      </div>
      <button id="signal" class="signal" aria-label="핑 보내기" disabled><span></span></button>
      <div class="availability-control">
        <span class="eyebrow" id="availability-label">내 상태</span>
        <button id="availability" class="availability" type="button" role="switch" aria-checked="true" aria-labelledby="availability-label" aria-describedby="availability-state" disabled>
          <span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span>
          <span id="availability-state">가능</span>
        </button>
      </div>
      <div class="channel-members">
        <span id="member-count" class="eyebrow">연결 중</span>
        <div id="users" class="users" role="list" aria-label="현재 채널 사용자"></div>
      </div>
    </section>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="connection" class="connection" aria-hidden="true"></div>
  </main>
</body>
</html>
